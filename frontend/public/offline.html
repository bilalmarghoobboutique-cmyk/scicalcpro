<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SciCalcPro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0b1020 0%, #141a35 50%, #0b1020 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(135deg, #06b6d4, #a855f7);
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(6, 182, 212, 0.6);
    }
    .note {
      margin-top: 24px;
      padding: 16px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 12px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Aap ka internet connection band hai, lekin <strong>fiker na karein</strong> — 
      saare calculators offline bhi kaam karte hain!
    </p>
    <a href="/" class="btn">← Go to Calculator</a>
    <div class="note">
      💡 <strong>Tip:</strong> Aapki history aur calculations save hain. 
      Internet wapas aane par sab kuch sync ho jayega.
    </div>
  </div>
</body>
</html>
